[project]
name = "pata"
version = "0.1.0"
description = "Dispatch triage for couriers: DELIVERABLE, CALL_FIRST or LIKELY_FAIL before the van leaves."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
]

[project.scripts]
pata = "pata.cli:main"

[dependency-groups]
data = [
    "huggingface-hub>=2.2.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pata"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
